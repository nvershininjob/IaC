# describe the tasks that Ansible must perform

---
- name: First server setup
  hosts: web_servers
  tasks:
    - name: enter a welcome message
      debug:
        msg: "Ansible готов к работе."

    - name: Created Nextcloud config file
      copy:
        content: "# Generated by Ansible\nclient_max_body_size 512M;\n"
        dest: "~/IaC/nextcloud_nginx.conf"
